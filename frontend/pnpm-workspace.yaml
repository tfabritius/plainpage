minimumReleaseAgeExcludePrune: true

# eslint-disable-next-line pnpm/yaml-enforce-settings
trustPolicy: off

peerDependencyRules:
  ignoreMissing:
    - webpack
    - vite
    - vue
    - vue-router

shellEmulator: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
